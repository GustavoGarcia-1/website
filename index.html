  <template id="p0"><h2 class="page-title">About</h2><p class="big-statement">Mathematics–Computer Science student at UC San Diego, building robots that learn and move.</p><div class="prose"><p>At Triton Droids, I serve as Vice President of Engineering and lead software, electrical, and mechanical work across two generations of humanoid robots.</p><p>I’m especially interested in robot learning, locomotion, and the difficult gap between a promising simulation and a machine that works in the real world. Solving those problems is what keeps me building.</p></div><nav class="links" aria-label="Contact links"><a href="assets/docs/Gustavo_Garcia_Intern_Resume.pdf" target="_blank">Resume</a><a href="https://www.linkedin.com/in/gustavogarcia1/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://tritondroids.org/" target="_blank" rel="noreferrer">Triton Droids</a><a href="mailto:gag009@ucsd.edu">Email</a></nav></template>
  <template id="p1"><div class="portrait" role="img" aria-label="Portrait of Gustavo Garcia"></div><p class="caption">Gustavo Garcia · Robotics at UC San Diego</p><p class="prose">I’m looking for robotics research and internship opportunities where I can contribute to learning, controls, and real-world deployment. If that sounds like your team, I’d love to hear from you.</p></template>
  <template id="p2"><div class="running-head"><span>Selected work</span><span>01 / 02</span></div><h2 class="project-index-title">Projects</h2><p class="project-index-intro">From humanoid hardware to robot learning.</p><div class="project-list"><a class="project-card featured" href="#project=locomotion" data-project="locomotion"><span class="project-card-number">01</span><div class="project-card-copy"><span class="project-card-tag">Featured · Triton Droids</span><h3>Humanoid Locomotion</h3><p>Building the control stack for a 20-DOF humanoid’s lower body.</p></div><img src="assets/images/humanoid-mini.png" alt="Triton Droids humanoid robot"></a><a class="project-card" href="#project=recap" data-project="recap"><span class="project-card-number">02</span><div class="project-card-copy"><span class="project-card-tag">Offline RL · VLA</span><h3>OpenRECAP</h3><p>A single-GPU, open-source approach to VLA policy improvement.</p></div><img src="assets/images/so101setup.png" alt="SO-101 robot arm setup"></a></div><p class="project-index-footer">Open a project for details ↗</p></template>
  <template id="p3"><div class="running-head"><span>Selected work</span><span>02 / 02</span></div><div class="project-list"><a class="project-card" href="#project=vla" data-project="vla"><span class="project-card-number">03</span><div class="project-card-copy"><span class="project-card-tag">Robot learning</span><h3>VLA Manipulation</h3><p>Training and deploying π0.5, ACT, and SmolVLA on SO-101 arms.</p></div><img src="assets/images/yam_telop.jpeg" alt="Robot arm teleoperation setup"></a><a class="project-card" href="#project=humanoid" data-project="humanoid"><span class="project-card-number">04</span><div class="project-card-copy"><span class="project-card-tag">Motion imitation</span><h3>Humanoid Fighting</h3><p>Full-body motion tracking for the Engine AI T800.</p></div><img src="assets/images/robot-side-profile.png" alt="Humanoid robot profile"></a><a class="project-card" href="#project=coffee" data-project="coffee"><span class="project-card-number">05</span><div class="project-card-copy"><span class="project-card-tag">Manipulation</span><h3>Coffee Making Robot</h3><p>A complete task learned from teleoperation demonstrations.</p></div><img src="assets/images/so101setup.png" alt="SO-101 coffee-making setup"></a><a class="project-card" href="#project=pick-place" data-project="pick-place"><span class="project-card-number">06</span><div class="project-card-copy"><span class="project-card-tag">Simulation · PPO</span><h3>Pick + Place</h3><p>2,048 parallel simulation rollouts with a Panda arm.</p></div><img src="assets/images/panda-arm.png" alt="Panda robot arm"></a></div></template>
  <template id="p4"><div class="running-head"><span>Fun</span></div><div class="gallery"><figure><img src="assets/images/camping.jpeg" alt="Camping outdoors"></figure><figure><img src="assets/images/fishing.JPG" alt="A day fishing"></figure><figure><img src="assets/images/rocky.jpg" alt="Rocky the dog"></figure></div></template>
  <template id="p5"><div class="running-head"><span>Keep in touch</span></div><div class="end-page"><blockquote class="end-mark">“Always work hard on something uncomfortably exciting.”<cite class="quote-credit">— Larry Page</cite></blockquote><div class="contact-block"><p class="contact-label">Let’s connect</p><a class="email" href="mailto:gag009@ucsd.edu">gag009@ucsd.edu</a><nav class="links" aria-label="Contact links"><a href="https://www.linkedin.com/in/gustavogarcia1/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://tritondroids.org/" target="_blank" rel="noreferrer">Triton Droids</a></nav></div></div></template>
  <script>
    const book=document.querySelector('#book'),left=document.querySelector('#leftPage'),right=document.querySelector('#rightPage'),sheet=document.querySelector('#turnSheet'),front=sheet.querySelector('.front'),back=sheet.querySelector('.back'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),status=document.querySelector('#status'),soundToggle=document.querySelector('#soundToggle'),music=document.querySelector('#music'),flipSound=document.querySelector('#flipSound');
    const templates=[0,1,2,3,4,5].map(i=>document.querySelector('#p'+i)),tracks=['assets/audio/background-fireside.mp3','assets/audio/background-jazz-restaurant.mp3'];let spread=0,mobilePage=0,projectReturnPage=2,opened=false,busy=false,turnToken=0,trackIndex=0,zoom=1,activeProject=null;
    const projects={
      locomotion:{title:'Humanoid Locomotion',kicker:'Triton Droids · Tritonoid S1',lead:'Training and deploying locomotion policies on a custom 1.3 m, 31 kg, 20-DOF humanoid.',copy:'<p>I trained reference-motion and velocity-commanded PPO locomotion policies in MJLab and MuJoCo, then deployed a 50 Hz ONNX policy using IMU and joint feedback with CAN motor commands.</p><p>To narrow the simulation-to-hardware gap, I built a MuJoCo system-identification pipeline for actuator inertia, friction, damping, and delay from hardware tests. I instrumented the control loop to diagnose gait instability across actuator response, command slew, and feedback timing.</p>',facts:[['Platform','Tritonoid S1'],['Height / mass','1.3 m · 31 kg'],['Actuation','20 DOF'],['Policy rate','50 Hz']],media:'<div class="project-media multi"><figure><video src="assets/videos/first_successful_walk_20260914_160628.mp4" controls playsinline preload="metadata" poster="assets/images/legs.jpeg"></video><figcaption>First hardware walk</figcaption></figure><figure><video src="assets/videos/standing_demo.mp4" controls playsinline preload="metadata" poster="assets/images/humanoid-mini.png"></video><figcaption>Standing demo</figcaption></figure><figure><video src="assets/videos/forward_0p2.mp4" controls playsinline preload="metadata"></video><figcaption>Velocity-commanded simulation</figcaption></figure></div><a class="paper-link" href="assets/docs/TDspecsheet.pdf" target="_blank">Read the Tritonoid S1 spec sheet ↗</a>',notes:['Trained reference-motion and velocity-commanded PPO policies','Deployed a 50 Hz ONNX policy on hardware','Identified actuator dynamics and instrumented the control loop']},
      coffee:{title:'Coffee Making Robot',kicker:'LeRobot · π0.5',lead:'Training a robot to complete an entire coffee-making sequence from human demonstrations.',copy:'<p>At Triton Droids, I built a long-horizon manipulation pipeline with SO-101 arms. I collected a multi-camera teleoperation dataset, organized and uploaded it through Hugging Face, then trained policies in LeRobot.</p><p>Across the experiments, π0.5 produced the strongest behavior. The work also exposed how strongly performance depends on lighting, viewpoint, and consistent demonstrations.</p>',facts:[['Dataset','200 episodes'],['Platform','SO-101'],['Approach','Imitation learning'],['Best model','π0.5']],media:'<div class="project-media"><video src="assets/videos/coffeemaking.mp4" controls playsinline preload="metadata" poster="assets/images/so101setup.png"></video></div>',notes:['Designed and printed stable camera mounts','Captured wrist and scene camera views','Trained a complete sequence rather than isolated motions']},
      vla:{title:'VLA Models for Manipulation',kicker:'π0.5 · ACT · SmolVLA',lead:'Training and evaluating robot policies for physical SO-101 manipulation.',copy:'<p>I fine-tuned π0.5 for 50,000 steps and compared it with ACT and SmolVLA on cube stacking. Under varied cube positions, π0.5 was the only policy to complete the full task, reaching 10% success; ACT and SmolVLA reached 0% in that evaluation.</p><p>I also deployed VLA policies on physical SO-101 arms. Camera pose, lighting, and differences between training demonstrations and real teleoperation caused failures, so I improved repeatability with rigid 3D-printed camera mounts and controlled lighting. The measured cube-stacking success rates are separate from those hardware tests.</p>',facts:[['Models','π0.5 · ACT · SmolVLA'],['Training','50K π0.5 steps'],['Evaluation','10% / 0% / 0%'],['Hardware','Physical SO-101']],media:'<div class="project-media"><video src="assets/videos/cubestack.mp4" controls playsinline preload="metadata" poster="assets/images/yam_telop.jpeg"></video></div><p class="media-caption">Cube-stacking evaluation</p>',notes:['Compared three policy families under varied object positions','Deployed policies on real SO-101 arms','Diagnosed camera, lighting, and data-distribution failures']},
      'pick-place':{title:'Pick + Place',kicker:'MuJoCo · PPO',lead:'GPU-accelerated reinforcement learning for a Panda arm in simulation.',copy:'<p>I built a pick-and-place environment using MuJoCo MJX, Brax, and JAX, running 2,048 environments in parallel for more than 160 million environment steps.</p><p>A phased reward encouraged reaching, grasping, transport, and placement. The learned policy discovered a strong approach trajectory, although consistent grasping remained the central challenge.</p>',facts:[['Robot','Franka Panda'],['Algorithm','PPO'],['Parallel worlds','2,048'],['Training','160M+ steps']],media:'<div class="project-media"><video src="assets/videos/task3final.mp4" controls playsinline preload="metadata"></video></div>',notes:['Designed staged reward shaping','Ran 40M-timestep PPO experiments','Analyzed the gap between reaching and reliable grasping']},
      humanoid:{title:'Humanoid Fighting',kicker:'MJLab · RSL-RL · PPO',lead:'Teaching a full-size humanoid to reproduce boxing and martial-arts motion with reinforcement learning.',copy:'<p>I built a motion-processing and imitation-learning pipeline for the Engine AI T800, mapping NPY and BVH motion onto a floating base and 25 actuated joints.</p><p>The resulting policies reproduced punch and kick motions and qualified in the Top 32 during the first round of the Ultimate Robot Knockout League.</p>',facts:[['Platform','Engine AI T800'],['Control','25 joints'],['Replay','50 Hz'],['Result','URKL Top 32']],media:'<div class="project-media"><video src="assets/videos/punchrl_v1.mp4" controls playsinline preload="metadata"></video></div>',notes:['Resampled 30 Hz motion into 50 Hz full-body references','Tracked 14 body segments with position, orientation, and velocity rewards','Added joint-limit, action-rate, and self-collision penalties']},
      recap:{title:'OpenRECAP',kicker:'Offline RL · SmolVLA · Single GPU',lead:'An open-source, single-GPU approach to offline reinforcement learning for VLA policies.',copy:'<p>I built an accessible alternative to a roughly 3B-parameter VLA offline-RL approach by using SmolVLA and replacing large VLM-based value estimation with a compact state-conditioned MLP.</p><p>The pipeline connects SO-101 simulation, demonstrations, autonomous rollouts, reward labeling, value estimation, and advantage-weighted fine-tuning. I also deployed the resulting policy workflow on physical SO-101 arms.</p><p>Across eight iterations, dense rewards improved evaluated success from 50% to 60%; success at the most difficult object position rose from 20% to 51%.</p>',facts:[['Model','SmolVLA · ~450M'],['Compute','Single GPU'],['Overall success','50% → 60%'],['Hardest position','20% → 51%']],media:'<div class="paper-embed"><iframe src="assets/docs/OpenRECAP.pdf#view=FitH" title="OpenRECAP research paper"></iframe></div><a class="paper-link" href="assets/docs/OpenRECAP.pdf" target="_blank">Open the complete paper ↗</a>',notes:['Open-source offline-RL implementation','Compact MLP value model replaces a large VLM','Evaluated reward design and spatial generalization']}
    };
    const content=i=>templates[i]?.innerHTML||'';
    const isMobile=()=>matchMedia('(max-width:800px)').matches;
    function controls(){prev.disabled=busy||!opened;next.disabled=busy||(opened&&(activeProject||(isMobile()?mobilePage===5:spread===2)))}
    function projectPage(project){const facts=project.facts.map(([term,value])=>`<div><dt>${term}</dt><dd>${value}</dd></div>`).join(''),notes=project.notes.map(note=>`<li>${note}</li>`).join('');return {left:`<button class="back-projects" data-back-projects>← All projects</button><p class="project-kicker">${project.kicker}</p><h2 class="project-title">${project.title}</h2><p class="project-lead">${project.lead}</p><div class="project-copy">${project.copy}</div><dl class="project-facts">${facts}</dl>`,right:`<div class="running-head"><span>Project study</span><span>Gustavo Garcia</span></div>${project.media}<div class="project-notes"><h3>Engineering notes</h3><ul>${notes}</ul></div>`}}
    function render(){if(activeProject){const page=projectPage(projects[activeProject]);left.innerHTML=isMobile()?'':page.left+'<span class="page-number left-num">Project</span>';right.innerHTML=(isMobile()?page.left:'')+page.right+'<span class="corner"></span><span class="page-number right-num">Detail</span>';status.textContent=projects[activeProject].title;controls();return}if(isMobile()){left.innerHTML='';right.innerHTML=content(mobilePage)+`<span class="corner"></span><span class="page-number right-num">${String(mobilePage+1).padStart(2,'0')}</span>`;status.textContent=`Page ${mobilePage+1}`;controls();return}const leftNumber=spread*2+1,rightNumber=spread*2+2;left.innerHTML=content(spread*2)+`<span class="page-number left-num">${String(leftNumber).padStart(2,'0')}</span>`;right.innerHTML=content(spread*2+1)+`<span class="corner"></span><span class="page-number right-num">${String(rightNumber).padStart(2,'0')}</span>`;status.textContent=`Pages ${leftNumber}–${rightNumber}`;controls()}
    function openProject(slug,push=true){if(!projects[slug]||busy)return;projectReturnPage=isMobile()?(opened?mobilePage:['locomotion','recap'].includes(slug)?2:3):2;activeProject=slug;opened=true;spread=1;book.classList.remove('closed');book.classList.add('opened');render();if(push&&location.hash!==`#project=${slug}`)history.pushState({project:slug},'',`#project=${slug}`)}
    function exitProject(push=true){if(!activeProject)return;activeProject=null;spread=1;mobilePage=projectReturnPage;render();if(push)history.pushState({},'','#projects')}
    function clearTurn(){sheet.className='turn-sheet';front.innerHTML='';back.innerHTML=''}
    function playFlip(){flipSound.currentTime=0;flipSound.volume=.55;flipSound.play().catch(()=>{})}
    function openBook(){if(busy||opened)return;busy=true;playFlip();opened=true;spread=0;mobilePage=0;book.classList.remove('closed');book.classList.add('opened');render();controls();setTimeout(()=>{busy=false;controls()},1300)}
    function closeBook(){if(busy||!opened)return;busy=true;playFlip();turnToken++;clearTurn();activeProject=null;opened=false;spread=0;mobilePage=0;book.classList.remove('opened');book.classList.add('closed');left.innerHTML='';right.innerHTML='';status.textContent='Open book';controls();if(location.hash)history.pushState({},'',location.pathname);setTimeout(()=>{busy=false;controls()},1300)}
    function turn(dir){
      if(busy)return;
      if(!opened){if(dir>0)openBook();return}
      if(activeProject){if(dir<0)exitProject();return}
      if(dir<0&&(isMobile()?mobilePage===0:spread===0)){closeBook();return}
      if(isMobile()){
        const target=mobilePage+dir;if(target<0||target>=templates.length)return;
        busy=true;playFlip();controls();const token=++turnToken;
        front.innerHTML=content(mobilePage);back.innerHTML=content(target);
        right.innerHTML=content(target)+`<span class="corner"></span><span class="page-number right-num">${String(target+1).padStart(2,'0')}</span>`;
        sheet.className='turn-sheet '+(dir>0?'active':'reverse');
        setTimeout(()=>{if(token!==turnToken)return;mobilePage=target;spread=Math.floor(target/2);render();clearTurn();busy=false;controls()},1180);
        return
      }
      const from=spread,target=from+dir;if(target<0||target>2)return;
      busy=true;playFlip();controls();const token=++turnToken;
      front.innerHTML=content(dir>0?from*2+1:from*2);
      back.innerHTML=content(dir>0?target*2:target*2+1);
      // Reveal the destination page beneath the turning sheet immediately.
      if(dir>0)right.innerHTML=content(target*2+1)+`<span class="corner"></span><span class="page-number right-num">${String(target*2+2).padStart(2,'0')}</span>`;
      else left.innerHTML=content(target*2)+`<span class="page-number left-num">${String(target*2+1).padStart(2,'0')}</span>`;
      sheet.className='turn-sheet '+(dir>0?'active':'reverse');
      setTimeout(()=>{if(token!==turnToken)return;spread=target;mobilePage=target*2;render();clearTurn();busy=false;controls()},1180)
    }
    next.addEventListener('click',()=>turn(1));prev.addEventListener('click',()=>turn(-1));
    document.querySelector('.open-book').addEventListener('click',event=>{const projectLink=event.target.closest('[data-project]'),backLink=event.target.closest('[data-back-projects]');if(projectLink){event.preventDefault();openProject(projectLink.dataset.project)}else if(backLink){exitProject()}});
    let wasMobile=isMobile();addEventListener('resize',()=>{const mobile=isMobile();if(mobile===wasMobile||busy)return;if(mobile)mobilePage=spread*2;else spread=Math.floor(mobilePage/2);wasMobile=mobile;if(opened)render()});
    addEventListener('popstate',()=>{const match=location.hash.match(/^#project=([\w-]+)$/);if(match&&projects[match[1]])openProject(match[1],false);else if(activeProject)exitProject(false)});
    addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowRight'||e.key==='PageDown')turn(1);if(e.key==='ArrowLeft'||e.key==='PageUp')turn(-1)});
    function setSoundState(playing){soundToggle.setAttribute('aria-pressed',String(playing));soundToggle.setAttribute('aria-label',playing?'Pause background music':'Play background music');soundToggle.title=playing?'Pause background music':'Play background music'}
    music.src=tracks[0];music.addEventListener('ended',()=>{trackIndex=(trackIndex+1)%tracks.length;music.src=tracks[trackIndex];music.play().catch(()=>setSoundState(false))});
    soundToggle.addEventListener('click',async()=>{if(music.paused){try{await music.play();setSoundState(true)}catch{setSoundState(false)}}else{music.pause();setSoundState(false)}});
    document.querySelector('.room').addEventListener('wheel',event=>{const paper=event.target.closest('.paper');if(paper&&paper.scrollHeight>paper.clientHeight&&!event.ctrlKey&&!event.metaKey)return;event.preventDefault();zoom=Math.max(.72,Math.min(1.42,zoom-event.deltaY*.001));book.style.setProperty('--zoom',zoom.toFixed(3))},{passive:false});
    const initialProject=location.hash.match(/^#project=([\w-]+)$/)?.[1];if(initialProject&&projects[initialProject])openProject(initialProject,false);else controls();
  </script>
</body></html>
