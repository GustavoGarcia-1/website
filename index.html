  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171614;--paper:#f2eee4;--paper2:#e9e3d7;--desk:#24221f;--red:#9c201a}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#181715;color:var(--ink);font-family:"Newsreader",Georgia,serif}
    button,a{font:inherit}a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:4px}
    .room{height:100dvh;display:grid;place-items:center;perspective:2400px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#171717 0,#080808 48%,#000 100%)}
    .room:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(112deg,#ffffff08 0,transparent 30% 74%,#000);mix-blend-mode:screen}
    .ambient{position:fixed;top:22px;left:26px;color:#d7d1c6;font:500 11px/1.4 "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.75}.ambient.right{left:auto;right:26px;text-align:right}

    .book-stage{--zoom:1;position:relative;width:min(88vw,1180px);height:min(76dvh,760px);transform-style:preserve-3d;transform:scale(var(--zoom));transition:width 1s cubic-bezier(.2,.75,.12,1),transform .22s ease-out;filter:drop-shadow(0 45px 42px #000b)}

    .paper.left{border-radius:7px 0 0 7px;box-shadow:inset -28px 0 42px #40372619,inset 1px 0 #fff}.paper.right{border-radius:0 7px 7px 0;box-shadow:inset 28px 0 42px #40372619,inset -1px 0 #aaa}
    .gutter{position:absolute;z-index:9;left:50%;top:0;bottom:0;width:34px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,#40382d26 32%,#100e0c4f 49%,#fff5 53%,transparent);mix-blend-mode:multiply}

    .cover{container-type:inline-size;position:absolute;inset:0;z-index:20;transform-origin:left center;transform-style:preserve-3d;background:linear-gradient(145deg,#1d1c1a,#050505 62%,#181715);color:#f8f5ee;border-radius:3px 10px 10px 3px;border:1px solid #46423c;box-shadow:inset 0 0 100px #ffffff0b,inset -12px 0 18px #0008,0 8px 0 #090909;transition:transform 1.3s cubic-bezier(.18,.72,.08,1),opacity .25s 1.05s}
    .opened .cover{transform:rotateY(-180deg);opacity:0;pointer-events:none}.cover:after{content:"";position:absolute;inset:13px;border:1px solid #3c3935;pointer-events:none}
    .spine{position:absolute;z-index:22;left:-27px;top:1%;bottom:0;width:34px;border-radius:10px 0 0 10px;background:linear-gradient(90deg,#060606,#34312d 43%,#080808 88%);box-shadow:-11px 12px 26px #000b,inset 3px 0 #4a4640}.spine:before,.spine:after{content:"";position:absolute;left:2px;right:0;height:10px;background:linear-gradient(#4a4640,#070707,#34312d)}.spine:before{top:8%}.spine:after{bottom:8%}
    .cover-content{height:100%;padding:9cqw 10cqw 10cqw;display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow:hidden}.cover-top{margin:0;font:500 2.6cqw "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase}.cover h1{align-self:center;margin:0;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;text-transform:uppercase;font-size:18.2cqw;line-height:.78;letter-spacing:-.055em;white-space:nowrap}.word{display:block;color:#f8f5ee}.cover-bottom{border-top:1.2cqw solid #f5f2eb;padding-top:3.2cqw}.cover-desc{margin:0;font:500 3.1cqw/1.55 "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.035em}.cover-volume{display:flex;justify-content:space-between;margin-top:4cqw;font:500 2.25cqw "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#aaa49b}

    .running-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #aaa298;padding-bottom:8px;margin-bottom:clamp(24px,4vh,40px);font:500 10px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.14em}.page-title{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:clamp(3.5rem,6vw,6.3rem);line-height:.84;letter-spacing:-.055em;margin:0 0 24px}.prose{font-size:clamp(1rem,1.25vw,1.14rem);line-height:1.62;margin:0}.prose p{margin:0 0 1em}.portrait{height:clamp(280px,44vh,440px);background:url('assets/images/gustavo-portrait-formal.png') center 35%/cover;filter:grayscale(1);margin:0 0 24px}.caption{font:500 10px "DM Sans";text-transform:uppercase;letter-spacing:.12em;margin:-15px 0 24px;color:#625d55}.big-statement{font-size:clamp(1.65rem,2.8vw,2.65rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 30px}.links{display:flex;flex-wrap:wrap;gap:8px 22px;font:600 13px "DM Sans"}.links a{text-underline-offset:5px}
    .contents{list-style:none;padding:0;margin:0;border-top:1px solid #958e83}.contents li{border-bottom:1px solid #b8b0a4}.contents a,.contents .inactive{display:grid;grid-template-columns:1fr auto;gap:20px;padding:18px 0;text-decoration:none}.contents h3{font-weight:500;font-size:clamp(1.25rem,2vw,1.75rem);line-height:1.08;margin:0}.contents p{grid-column:1/-1;margin:3px 0 0;font-size:.92rem;line-height:1.45;color:#555048}.contents small{font:500 9px "DM Sans";text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}.contents a:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}.skills{columns:2;column-gap:28px;border-top:1px solid #aaa298;padding-top:15px;font:500 12px/1.9 "DM Sans";text-transform:uppercase}.skills span{display:block;break-inside:avoid}
    .gallery{display:grid;grid-template-columns:1.35fr .8fr;grid-template-rows:1fr 1fr;gap:7px;height:calc(100% - 62px)}.gallery figure{margin:0;overflow:hidden;position:relative}.gallery figure:first-child{grid-row:1/3}.gallery img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .3s,transform .5s}.gallery figure:hover img{filter:grayscale(0);transform:scale(1.02)}.gallery figcaption{position:absolute;bottom:7px;left:8px;background:var(--paper);padding:4px 6px;font:600 9px "DM Sans";text-transform:uppercase}.end-page{height:100%;display:flex;flex-direction:column;justify-content:space-between}.end-mark{font-family:"Libre Caslon Display";font-size:clamp(4rem,7vw,7rem);line-height:.85;letter-spacing:-.05em}.email{font-size:clamp(1.2rem,2vw,1.8rem);text-underline-offset:6px}
    .project-kicker{margin:0 0 16px;font:600 10px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.16em}.project-title{margin:0 0 24px;font:400 clamp(3.2rem,5.7vw,5.8rem)/.86 "Libre Caslon Display",Georgia,serif;letter-spacing:-.055em}.project-lead{margin:0 0 26px;font-size:clamp(1.35rem,2vw,2rem);line-height:1.12}.project-copy{font-size:clamp(.96rem,1.2vw,1.08rem);line-height:1.55}.project-copy p{margin:0 0 1em}.project-facts{margin:24px 0 0;padding:16px 0 0;border-top:1px solid #aaa298;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}.project-facts dt{font:600 9px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.12em}.project-facts dd{margin:4px 0 0;font-size:1rem}.project-media{width:100%;height:clamp(235px,43vh,430px);margin:0 0 24px;background:#111;overflow:hidden}.project-media img,.project-media video{width:100%;height:100%;display:block;object-fit:cover;filter:grayscale(1)}.project-notes{padding-top:4px}.project-notes h3{margin:0 0 12px;font:400 clamp(1.6rem,2.4vw,2.4rem) "Libre Caslon Display",serif}.project-notes ul{margin:0;padding-left:1.1em;font-size:clamp(.93rem,1.1vw,1.04rem);line-height:1.48}.project-notes li{margin:.45em 0}.back-projects{border:0;background:none;padding:0 0 7px;border-bottom:1px solid currentColor;color:inherit;cursor:pointer;font:600 10px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.13em}.back-projects:hover{opacity:.55}.paper-embed{height:clamp(300px,55vh,520px);margin-bottom:18px;border:1px solid #9b9489;background:#ded8cc}.paper-embed iframe{width:100%;height:100%;display:block;border:0}.paper-link{display:inline-block;font:600 10px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.12em;text-underline-offset:5px}

    .turn-sheet{position:absolute;z-index:15;top:0;bottom:0;width:50%;left:50%;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;display:none}.turn-sheet.active{display:block;animation:turnNext 1.05s cubic-bezier(.24,.65,.15,1) forwards}@keyframes turnNext{0%{transform:rotateY(0)}45%{filter:brightness(.72)}100%{transform:rotateY(-180deg);filter:brightness(1)}}.turn-sheet.reverse{left:0;transform-origin:right center;display:block;animation:turnPrev 1.05s cubic-bezier(.24,.65,.15,1) forwards}@keyframes turnPrev{0%{transform:rotateY(0)}45%{filter:brightness(.72)}100%{transform:rotateY(180deg);filter:brightness(1)}}.turn-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);box-shadow:inset 25px 0 40px #332b201c,-8px 5px 22px #0004}.turn-face.back{transform:rotateY(180deg);background:var(--paper2)}

    .controls{position:fixed;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}.controls button{width:58px;height:46px;border:0;border-radius:2px;background:#fff;color:#000;cursor:pointer;pointer-events:auto;display:grid;place-items:center;box-shadow:0 8px 24px #0009;transition:transform .2s,opacity .2s}.controls button:first-child{clip-path:polygon(0 50%,13px 0,100% 0,100% 100%,13px 100%)}.controls button:last-child{clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}.controls button:disabled{opacity:.1;cursor:not-allowed}.controls button:hover:not(:disabled){transform:translateY(-4px)}.controls svg{width:25px;height:15px;display:block;stroke:currentColor;stroke-width:1.6}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.page-number{position:absolute;bottom:15px;font:500 10px "DM Sans";letter-spacing:.12em;color:#6d675e}.page-number.left-num{left:clamp(28px,4vw,58px)}.page-number.right-num{right:clamp(28px,4vw,58px)}
    .sound-toggle{position:fixed;z-index:51;top:22px;right:24px;width:34px;height:34px;padding:0;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 3px 8px #000);transition:transform .2s,opacity .2s}.sound-toggle:hover{transform:scale(1.12);opacity:.72}.sound-toggle svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.sound-toggle .waves{opacity:0}.sound-toggle[aria-pressed="true"] .waves{opacity:1}.sound-toggle[aria-pressed="true"] .mute-line{opacity:0}
    .corner{position:absolute;right:0;bottom:0;width:74px;height:74px;pointer-events:none;background:linear-gradient(135deg,transparent 49%,#bdb5a8 50%,#eee8dc 72%);opacity:.35}
    @media(max-width:800px){.ambient{display:none}.book-stage,.book-stage.closed{width:min(86vw,430px);height:min(72dvh,650px);transform:scale(var(--zoom))}.opened.book-stage{width:min(92vw,540px)}.open-book{grid-template-columns:1fr}.paper.left{display:none}.gutter,.page-stack.left{display:none}.page{padding:30px 25px 70px}.turn-sheet{width:100%;left:0}.gallery{height:64vh}.spine{left:-18px;width:24px}.controls{bottom:14px}.controls button{width:54px;height:42px}.sound-toggle{top:14px;right:14px;width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

      <div class="turn-sheet" id="turnSheet"><div class="turn-face front"></div><div class="turn-face back"></div></div>
      <section class="cover" id="cover" aria-label="Book cover">
        <div class="spine"></div><div class="cover-content"><p class="cover-top">Selected works</p><h1><span class="word">Gustavo</span><span class="word">Garcia</span></h1><div class="cover-bottom"><p class="cover-desc">UC San Diego · Electrical Engineering<br>Robotics · Machine Learning · Controls</p><div class="cover-volume"><span>Portfolio</span><span>2026</span></div></div></div>
      </section>
    </div>
  </main>
  <button class="sound-toggle" id="soundToggle" aria-label="Play background music" aria-pressed="false" title="Play background music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path class="waves" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/><path class="mute-line" d="m17 10 4 4m0-4-4 4"/></svg></button><audio id="music" preload="metadata"></audio><audio id="flipSound" preload="auto" src="assets/audio/page-flip.mp3"></audio>
  <nav class="controls" aria-label="Book controls"><button id="prev" aria-label="Previous page" disabled><svg viewBox="0 0 40 14" aria-hidden="true"><path d="M40 7H1m0 0 7-6M1 7l7 6" fill="none"/></svg></button><span class="status" id="status" aria-live="polite">Open book</span><button id="next" aria-label="Next page"><svg viewBox="0 0 40 14" aria-hidden="true"><path d="M0 7h39m0 0-7-6m7 6-7 6" fill="none"/></svg></button></nav>
  <template id="p0"><h2 class="page-title">About</h2><p class="big-statement">Electrical Engineering and Mathematics–Computer Science at UC San Diego, focused on intelligent machines.</p><div class="prose"><p>I’m Vice President of Engineering at Triton Droids, leading software, electrical, and mechanical teams across two generations of humanoid robots.</p><p>My work spans bipedal locomotion, actuator modeling, vision-language-action policies, reinforcement learning, and sim-to-real robotics.</p></div><nav class="links" aria-label="Contact links"><a href="assets/docs/Gustavo_Garcia_Resume.pdf" target="_blank">Resume</a><a href="https://www.linkedin.com/in/gustavogarcia1/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://tritondroids.org/" target="_blank" rel="noreferrer">Triton Droids</a><a href="mailto:gag009@ucsd.edu">Email</a></nav></template>
  <template id="p1"><div class="portrait" role="img" aria-label="Portrait of Gustavo Garcia"></div><p class="caption">Gustavo Garcia · UC San Diego</p><p class="prose">My work explores how robots can learn useful physical behavior from demonstrations, simulation, and interaction.</p></template>
  <template id="p2"><div class="running-head"><span>Selected work</span><span>Robotics</span></div><h2 class="page-title">Projects</h2><ul class="contents"><li><a href="#project=coffee" data-project="coffee"><h3>Coffee Making Robot</h3><small>LeRobot · π0.5</small><p>Teleoperation data and policy training for a complete coffee-making sequence.</p></a></li><li><a href="#project=cube" data-project="cube"><h3>Cube Stacking Robot</h3><small>VLA · SO-101</small><p>Fine-tuning and comparing smolVLA, ACT, and π0.5.</p></a></li><li><a href="#project=pick-place" data-project="pick-place"><h3>Pick + Place</h3><small>MuJoCo · PPO</small><p>GPU-accelerated reinforcement learning with 2,048 parallel rollouts.</p></a></li></ul></template>
  <template id="p3"><div class="running-head"><span>Selected work</span><span>Research</span></div><ul class="contents"><li><a href="#project=humanoid" data-project="humanoid"><h3>Humanoid Fighting</h3><small>MJLab · PPO</small><p>Motion-imitation policies that qualified in the Top 32 of the Ultimate Robot Knockout League.</p></a></li><li><a href="#project=recap" data-project="recap"><h3>OpenRECAP</h3><small>Offline RL · SmolVLA</small><p>An open, single-GPU self-improvement pipeline for a lightweight VLA.</p></a></li></ul><h3>Working knowledge</h3><div class="skills"><span>Python</span><span>C++</span><span>PyTorch</span><span>LeRobot</span><span>MuJoCo</span><span>Isaac Lab</span><span>Reinforcement Learning</span><span>Behavior Cloning</span><span>CAD</span><span>EagleCAD</span></div></template>
  <template id="p4"><div class="running-head"><span>Field notes</span><span>Outside the lab</span></div><div class="gallery"><figure><img src="assets/images/camping.jpeg" alt="Camping outdoors"><figcaption>Out there</figcaption></figure><figure><img src="assets/images/fishing.JPG" alt="A day fishing"><figcaption>On the water</figcaption></figure><figure><img src="assets/images/rocky.jpg" alt="Rocky the dog"><figcaption>Rocky</figcaption></figure></div></template>
  <template id="p5"><div class="running-head"><span>Colophon</span><span>Keep in touch</span></div><div class="end-page"><div><p class="end-mark">Let’s build something that moves.</p><p class="prose">For research, robotics, and engineering conversations:</p></div><div><a class="email" href="mailto:gag009@ucsd.edu">gag009@ucsd.edu</a><nav class="links" aria-label="Contact links"><a href="https://www.linkedin.com/in/gustavogarcia1/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://tritondroids.org/" target="_blank" rel="noreferrer">Triton Droids</a></nav></div></div></template>
  <script>
    const book=document.querySelector('#book'),left=document.querySelector('#leftPage'),right=document.querySelector('#rightPage'),sheet=document.querySelector('#turnSheet'),front=sheet.querySelector('.front'),back=sheet.querySelector('.back'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),status=document.querySelector('#status'),soundToggle=document.querySelector('#soundToggle'),music=document.querySelector('#music'),flipSound=document.querySelector('#flipSound');
    const templates=[0,1,2,3,4,5].map(i=>document.querySelector('#p'+i)),tracks=['assets/audio/background-fireside.mp3','assets/audio/background-jazz-restaurant.mp3'];let spread=0,opened=false,busy=false,turnToken=0,trackIndex=0,zoom=1,activeProject=null;
    const projects={
      coffee:{title:'Coffee Making Robot',kicker:'LeRobot · π0.5',lead:'Training a robot to complete an entire coffee-making sequence from human demonstrations.',copy:'<p>At Triton Droids, I built a long-horizon manipulation pipeline with SO-101 arms. I collected a multi-camera teleoperation dataset, organized and uploaded it through Hugging Face, then trained policies in LeRobot.</p><p>Across the experiments, π0.5 produced the strongest behavior. The work also exposed how strongly performance depends on lighting, viewpoint, and consistent demonstrations.</p>',facts:[['Dataset','200 episodes'],['Platform','SO-101'],['Approach','Imitation learning'],['Best model','π0.5']],media:'<div class="project-media"><video src="assets/videos/coffeemaking.mp4" controls playsinline preload="metadata" poster="assets/images/so101setup.png"></video></div>',notes:['Designed and printed stable camera mounts','Captured wrist and scene camera views','Trained a complete sequence rather than isolated motions']},
      cube:{title:'Cube Stacking Robot',kicker:'VLA · SO-101',lead:'A direct comparison of vision-language-action and action-chunking policies on cube stacking.',copy:'<p>I gathered hours of teleoperated demonstrations using wrist and eagle-eye cameras, then trained smolVLA, ACT, and π0.5 on H100-class compute.</p><p>π0.5 performed best at roughly 10% task success, while the other policies did not complete the full stack. That gap shaped the next round of data and evaluation work.</p>',facts:[['Models','smolVLA · ACT · π0.5'],['Robot','SO-101'],['Compute','H100 GPU'],['Best result','π0.5 · ~10%']],media:'<div class="project-media"><video src="assets/videos/cubestack.mp4" controls playsinline preload="metadata"></video></div>',notes:['Built a consistent dual-camera collection setup','Compared three policy families on the same task','Used failure cases to identify dataset improvements']},
      'pick-place':{title:'Pick + Place',kicker:'MuJoCo · PPO',lead:'GPU-accelerated reinforcement learning for a Panda arm in simulation.',copy:'<p>I built a pick-and-place environment using MuJoCo MJX, Brax, and JAX, running 2,048 environments in parallel for more than 160 million environment steps.</p><p>A phased reward encouraged reaching, grasping, transport, and placement. The learned policy discovered a strong approach trajectory, although consistent grasping remained the central challenge.</p>',facts:[['Robot','Franka Panda'],['Algorithm','PPO'],['Parallel worlds','2,048'],['Training','160M+ steps']],media:'<div class="project-media"><video src="assets/videos/task3final.mp4" controls playsinline preload="metadata"></video></div>',notes:['Designed staged reward shaping','Ran 40M-timestep PPO experiments','Analyzed the gap between reaching and reliable grasping']},
      humanoid:{title:'Humanoid Fighting',kicker:'MJLab · RSL-RL · PPO',lead:'Teaching a full-size humanoid to reproduce boxing and martial-arts motion with reinforcement learning.',copy:'<p>I built a motion-processing and imitation-learning pipeline for the Engine AI T800, mapping NPY and BVH motion onto a floating base and 25 actuated joints.</p><p>The resulting policies reproduced punch and kick motions and qualified in the Top 32 during the first round of the Ultimate Robot Knockout League.</p>',facts:[['Platform','Engine AI T800'],['Control','25 joints'],['Replay','50 Hz'],['Result','URKL Top 32']],media:'<div class="project-media"><video src="assets/videos/punchrl_v1.mp4" controls playsinline preload="metadata"></video></div>',notes:['Resampled 30 Hz motion into 50 Hz full-body references','Tracked 14 body segments with position, orientation, and velocity rewards','Added joint-limit, action-rate, and self-collision penalties']},
      recap:{title:'OpenRECAP',kicker:'Offline RL · SmolVLA · Single GPU',lead:'One of the first open implementations of advantage-conditioned offline RL for a small, open-source vision-language-action model.',copy:'<p>OpenRECAP adapts the self-improvement procedure behind π0.6 to SmolVLA, a compact, roughly 450M-parameter open-source VLA designed to run on a single GPU.</p><p>I replaced RECAP’s large VLM value head with a lightweight state-based MLP and built the full MuJoCo SO-101 loop: behavior cloning, autonomous rollouts, reward labeling, value estimation, advantage labeling, and iterative policy fine-tuning.</p><p>Across eight iterations, dense rewards improved overall success from 50% to 60% and raised success at the hardest position from 20% to 51%.</p>',facts:[['Model','SmolVLA · ~450M'],['Compute','Single GPU'],['Overall success','50% → 60%'],['Hardest position','20% → 51%']],media:'<div class="paper-embed"><iframe src="assets/docs/OpenRECAP.pdf#view=FitH" title="OpenRECAP research paper"></iframe></div><a class="paper-link" href="assets/docs/OpenRECAP.pdf" target="_blank">Open the complete paper ↗</a>',notes:['Open-source, reproducible RECAP implementation','Lightweight MLP value function replaces a large auxiliary VLM','Dense reward design prevented collapse and improved spatial generalization']}
    };
    const content=i=>templates[i]?.innerHTML||'';
    function controls(){prev.disabled=busy||!opened;next.disabled=busy||(opened&&(activeProject||spread===2))}
    function projectPage(project){const facts=project.facts.map(([term,value])=>`<div><dt>${term}</dt><dd>${value}</dd></div>`).join(''),notes=project.notes.map(note=>`<li>${note}</li>`).join('');return {left:`<button class="back-projects" data-back-projects>← All projects</button><p class="project-kicker">${project.kicker}</p><h2 class="project-title">${project.title}</h2><p class="project-lead">${project.lead}</p><div class="project-copy">${project.copy}</div><dl class="project-facts">${facts}</dl>`,right:`<div class="running-head"><span>Project study</span><span>Gustavo Garcia</span></div>${project.media}<div class="project-notes"><h3>Engineering notes</h3><ul>${notes}</ul></div>`}}
    function render(){if(activeProject){const page=projectPage(projects[activeProject]);left.innerHTML=page.left+'<span class="page-number left-num">Project</span>';right.innerHTML=page.right+'<span class="corner"></span><span class="page-number right-num">Detail</span>';status.textContent=projects[activeProject].title;controls();return}const leftNumber=spread*2+1,rightNumber=spread*2+2;left.innerHTML=content(spread*2)+`<span class="page-number left-num">${String(leftNumber).padStart(2,'0')}</span>`;right.innerHTML=content(spread*2+1)+`<span class="corner"></span><span class="page-number right-num">${String(rightNumber).padStart(2,'0')}</span>`;status.textContent=`Pages ${leftNumber}–${rightNumber}`;controls()}
    function openProject(slug,push=true){if(!projects[slug]||busy)return;activeProject=slug;opened=true;spread=1;book.classList.remove('closed');book.classList.add('opened');render();if(push&&location.hash!==`#project=${slug}`)history.pushState({project:slug},'',`#project=${slug}`)}
    function exitProject(push=true){if(!activeProject)return;activeProject=null;spread=1;render();if(push)history.pushState({},'','#projects')}
    function clearTurn(){sheet.className='turn-sheet';front.innerHTML='';back.innerHTML=''}
    function playFlip(){flipSound.currentTime=0;flipSound.volume=.55;flipSound.play().catch(()=>{})}
    function openBook(){if(busy||opened)return;busy=true;playFlip();opened=true;spread=0;book.classList.remove('closed');book.classList.add('opened');render();controls();setTimeout(()=>{busy=false;controls()},1300)}
    function closeBook(){if(busy||!opened)return;busy=true;playFlip();turnToken++;clearTurn();activeProject=null;opened=false;spread=0;book.classList.remove('opened');book.classList.add('closed');left.innerHTML='';right.innerHTML='';status.textContent='Open book';controls();if(location.hash)history.pushState({},'',location.pathname);setTimeout(()=>{busy=false;controls()},1300)}
    function turn(dir){
      if(busy)return;
      if(!opened){if(dir>0)openBook();return}
      if(activeProject){if(dir<0)exitProject();return}
      if(dir<0&&spread===0){closeBook();return}
      const from=spread,target=from+dir;if(target<0||target>2)return;
      busy=true;playFlip();controls();const token=++turnToken;
      front.innerHTML=dir>0?content(from*2+1):content(from*2);
      back.innerHTML=dir>0?content(target*2):content(target*2+1);
      sheet.className='turn-sheet '+(dir>0?'active':'reverse');
      setTimeout(()=>{if(token!==turnToken)return;spread=target;render();clearTurn();busy=false;controls()},1080)
    }
    next.addEventListener('click',()=>turn(1));prev.addEventListener('click',()=>turn(-1));
    document.querySelector('.open-book').addEventListener('click',event=>{const projectLink=event.target.closest('[data-project]'),backLink=event.target.closest('[data-back-projects]');if(projectLink){event.preventDefault();openProject(projectLink.dataset.project)}else if(backLink){exitProject()}});
    addEventListener('popstate',()=>{const match=location.hash.match(/^#project=([\w-]+)$/);if(match&&projects[match[1]])openProject(match[1],false);else if(activeProject)exitProject(false)});
    addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowRight'||e.key==='PageDown')turn(1);if(e.key==='ArrowLeft'||e.key==='PageUp')turn(-1)});
    function setSoundState(playing){soundToggle.setAttribute('aria-pressed',String(playing));soundToggle.setAttribute('aria-label',playing?'Pause background music':'Play background music');soundToggle.title=playing?'Pause background music':'Play background music'}
    music.src=tracks[0];music.addEventListener('ended',()=>{trackIndex=(trackIndex+1)%tracks.length;music.src=tracks[trackIndex];music.play().catch(()=>setSoundState(false))});
    soundToggle.addEventListener('click',async()=>{if(music.paused){try{await music.play();setSoundState(true)}catch{setSoundState(false)}}else{music.pause();setSoundState(false)}});
    document.querySelector('.room').addEventListener('wheel',event=>{event.preventDefault();zoom=Math.max(.72,Math.min(1.42,zoom-event.deltaY*.001));book.style.setProperty('--zoom',zoom.toFixed(3))},{passive:false});
    const initialProject=location.hash.match(/^#project=([\w-]+)$/)?.[1];if(initialProject&&projects[initialProject])openProject(initialProject,false);else controls();
  </script>
</body></html>
